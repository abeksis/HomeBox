# Builds homebox.abeksis.net from this repository and publishes it to GitHub Pages.
#
# Runs on every push to main, so the app catalog follows the modules without
# anyone remembering to rebuild. Not on tags: the github-pages environment only
# deploys from main, and a tag run cancels the main run it arrives with. Every
# release ends with a push to main (the manifest), which rebuilds the changelog. No dependencies to install: site/build.js is plain
# Node, and it reads the modules through the dashboard's own loader.
name: site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The changelog reads release tags as well as releases/history.json.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        run: node site/build.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://homebox.abeksis.net
    steps:
      - uses: actions/deploy-pages@v4
