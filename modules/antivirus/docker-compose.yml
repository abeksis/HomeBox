# ==========================================
# HOMEBOX - Antivirus Module
# ClamAV over the downloads folder, and nowhere else.
# ==========================================

x-homebox:
  id: antivirus
  added_at: "2026-09-09"
  title: "ClamAV"
  tagline: "Scan what arrives, not what you own"
  description: "An open-source virus scanner watching the downloads folder. Most of what lands there is video, which is not what malware hides in — but a 'movie' that is really an .exe, or a keygen inside a release archive, is exactly what this catches before anyone opens it on a Windows machine."
  icon: "clam-av.svg"
  category: "security"
  required: false
  default: false
  ram: "~1.5GB"
  theme:
    emoji: "🛡️"
    color: "#d33a2c"
    bg: "rgba(211,58,44,0.12)"
  tips:
    - "It keeps the whole signature database in memory — about 1.5GB, which is most of what this module costs"
    - "It sees the downloads folder and nothing else. The media library, your documents and this box's own config are out of its reach on purpose"
    - "Quarantine is a dot-prefixed folder OUTSIDE downloads, so Sonarr and Radarr never try to import something that was moved there"
    - "The first start downloads signatures before it can scan anything, which takes a few minutes on a normal connection"
  services:
    antivirus:
      friendly_name: "ClamAV"
      color: "#d33a2c"
      description: "Virus scanning for downloads"
      icon: "clam-av.svg"
      # A daemon with no web interface of its own — `homebox logs antivirus`
      # is where its findings appear.
      internal: true

services:
  antivirus:
    image: clamav/clamav:1.5.4
    container_name: clamav
    environment:
      - TZ=${TZ:-UTC}
      # freshclam runs in-container on a schedule. Four checks a day is what
      # upstream asks unofficial mirrors to stay under.
      - CLAMAV_NO_FRESHCLAMD=false
      - FRESHCLAM_CHECKS=4
    volumes:
      # Read-write, and it is the one thing here that needs to be: moving a
      # hit out of the way is the useful half of finding it.
      - ${HB_MEDIA_ROOT:-${HB_DATA_DIR:-${HB_ROOT:-/opt/homebox}/data}}/${HB_DOWNLOADS:-torrents}:/scan/downloads
      # Deliberately a sibling of downloads, not a child, and dot-prefixed:
      # inside it, the *arr import scanners would find quarantined files and
      # try to import them, which is precisely the outcome being prevented.
      - ${HB_MEDIA_ROOT:-${HB_DATA_DIR:-${HB_ROOT:-/opt/homebox}/data}}/.quarantine:/scan/quarantine
      # Signature database, so a restart does not re-download 1.5GB.
      - ${HB_ROOT:-/opt/homebox}/modules/antivirus/config/clamav:/var/lib/clamav
    networks:
      - homebox_internal
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh || exit 1"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 300s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.00'
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: always

networks:
  homebox_internal:
    external: true
