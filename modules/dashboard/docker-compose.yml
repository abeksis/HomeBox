# ==========================================
# HOMEBOX - Dashboard Module
# The HomeBox dashboard: reads the module tree, installs and controls
# modules, and serves the UI on 8443.
# ==========================================

x-homebox:
  id: dashboard
  added_at: "2026-09-05"
  title: "HomeBox Dashboard"
  tagline: "Install apps and see how the box is doing"
  description: "One page for the whole box: install a module with a click, start and stop what is running, watch host CPU, memory and disk, and read any container's logs without opening a shell."
  icon: "homebox.svg"
  category: "core"
  required: true
  default: true
  ram: "~80MB"
  theme:
    emoji: "📦"
    color: "#8b5cf6"
    bg: "rgba(139,92,246,0.12)"
  tips:
    - "It holds a read-write Docker socket because installing an app means creating containers — that is root on this box, so keep it off the internet"
    - "/opt/homebox is mounted at the same path inside the container so compose bind mounts resolve identically on both sides"
    - "Reachable at http://<box>:8443 even before DNS points a hostname here"
  services:
    dashboard:
      friendly_name: "HomeBox"
      color: "#8b5cf6"
      description: "The dashboard you are looking at"
      icon: "homebox.svg"
      port_map: 8443
      url_scheme: "http"

services:
  dashboard:
    build:
      context: ${HB_ROOT:-/opt/homebox}/dashboard
    image: homebox-dashboard:${HB_VERSION:-local}
    container_name: dashboard
    ports:
      - "8443:8443"
    environment:
      - TZ=${TZ:-UTC}
      - HOMEBOX_ROOT=/opt/homebox
      - PORT=8443
      # Passed in rather than read from .env: the dashboard builds app links
      # from this, and has no other reason to open a file full of secrets.
      - HB_HOST_ADDRESS=${HB_HOST_ADDRESS:-localhost}
    volumes:
      # Same path inside and out: `docker compose -f /opt/homebox/modules/...`
      # run from in here produces bind mounts the host daemon can resolve.
      - ${HB_ROOT:-/opt/homebox}:/opt/homebox
      # Read-write on purpose — installing a module creates containers.
      - /var/run/docker.sock:/var/run/docker.sock
      # The host root, for a real disk figure rather than the image layer's.
      - /:/host/root:ro
    networks:
      - homebox_proxy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.00'
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8443/api/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: always

networks:
  homebox_proxy:
    external: true
